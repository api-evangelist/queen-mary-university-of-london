    x-probe:
      baseURL_status: 200
      probed: '2026-09-01'
      note: >-
        200, 192 bytes application/xml, EXCEPTION class core\exception\moodle_exception, ERRORCODE
        invalidtoken. Live and token-gated.

  - aid: queen-mary-university-of-london:shibboleth-saml-idp
    name: Shibboleth SAML Identity Provider (UK Access Management Federation)
    description: >-
      Queen Mary's own Shibboleth Identity Provider, entityID
      https://idp.shibboleth.qmul.ac.uk/idp/shibboleth, asserting shibmd:Scope "qmul.ac.uk". Its
      entity descriptor is published as signed, machine-readable SAML metadata through the Jisc UK
      Access Management Federation MDQ service and onward into eduGAIN, and was retrieved live on
      2026-09-01. It advertises SAML 2.0, SAML 1.1 and the native Shibboleth authn profile over
      HTTP-Redirect, HTTP-POST, HTTP-POST-SimpleSign and SOAP artifact resolution and attribute
      query. Institution-operated by definition, and the surface class this cohort was most
      completely missing. It is not a public developer API: nothing can obtain an assertion without
      being registered as a service provider in the federation.
