aid: queen-mary-university-of-london
name: Queen Mary University of London
description: >-
  Queen Mary University of London (QMUL) is a public research university in
  London, United Kingdom, and a member of the Russell Group, ranked #120 in the
  QS World University Rankings 2025. Its public, machine-accessible footprint is
  research- and library-oriented rather than a formal developer program: Queen
  Mary Research Online (QMRO) is an open-access DSpace institutional repository
  that exposes a standards-based OAI-PMH metadata-harvesting interface, and the
  university maintains a public GitHub organization (QMUL) for code released by
  its staff. QMUL does not publish a central, branded developer portal with
  signup-gated REST APIs; core student, timetable, and library platforms
  (QMplus/Moodle, MyQMUL, library discovery) sit behind institutional
  authentication.
