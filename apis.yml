    x-token-endpoint: https://qmplus.qmul.ac.uk/mod/lti/token.php
    x-auth-endpoint: https://qmplus.qmul.ac.uk/mod/lti/auth.php
    x-services-endpoint: https://qmplus.qmul.ac.uk/mod/lti/services.php
    x-probe:
