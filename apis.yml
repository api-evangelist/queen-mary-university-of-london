aid: queen-mary-university-of-london
name: Queen Mary University of London
x-type: university
x-category: Public Research University
description: >-
  Queen Mary University of London (QMUL) is a public research university in London and a member of
  the Russell Group. It runs no developer portal, publishes no OpenAPI, and offers no self-service
  API credentials — but the claim that it therefore has no programmable surface is wrong, and this
  profile replaces it. Four surfaces are institution-operated and were verified live: Queen Mary
  Research Online (QMRO) runs DSpace 8.4 and answers an unauthenticated HAL service document at
  qmro.qmul.ac.uk/server/api advertising 79 endpoint families; QMplus, the university's Moodle
  learning platform, is an LTI 1.3 Advantage tool platform publishing its own RSA key set, OIDC
  auth, token and services endpoints; the QMplus Moodle web-services REST entry point is live and
  token-gated; and Apocrita, the university's own HPC service, publishes machine-readable
  documentation at docs.hpc.qmul.ac.uk on Queen Mary's own address space. Two more are federated
  identity the institution genuinely owns: a Shibboleth Identity Provider registered in the Jisc UK
  Access Management Federation with the scope qmul.ac.uk, and a Microsoft Entra ID tenant whose
  OpenID Connect discovery document resolves from the qmul.ac.uk domain. Two are tenant
  relationships on suppliers' platforms and are recorded as relationships, not as Queen Mary's
  engineering: the Ex Libris Primo VE / Alma library discovery deployment behind
  librarysearch.qmul.ac.uk, whose public configuration API and SRU endpoint both answer, and the
  SearchStax Solr index that powers site and course search. Three are registry memberships — a
  DataCite provider record, a Crossref member id with its own DOI prefix, and a ROR identifier.
  Student-facing systems (MySIS, timetables, MyQMUL) are authentication-gated, no open-data portal
  exists, and the institution's public dataset publishing amounts to CSV files under the Freedom of
  Information publication scheme.
