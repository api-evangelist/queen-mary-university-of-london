apis:
  - aid: queen-mary-university-of-london:qmro-oai-pmh
    name: Queen Mary Research Online (QMRO) OAI-PMH Interface
    description: >-
      Queen Mary Research Online (QMRO) is the university's open-access
      institutional repository, built on DSpace. It exposes a public OAI-PMH 2.0
      metadata-harvesting endpoint that supports the standard verbs (Identify,
      ListRecords, ListSets, GetRecord, etc.) for harvesting Dublin Core and
      related metadata for theses and research outputs. No authentication is
      required.
