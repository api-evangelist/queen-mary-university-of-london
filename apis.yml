apis:
  - aid: queen-mary-university-of-london:qmro-dspace-rest
    name: Queen Mary Research Online (QMRO) — DSpace 8.4 REST API
    description: >-
      Queen Mary's open-access institutional repository runs DSpace 8.4 and exposes the standard
      DSpace REST API on the university's own host. The HAL service document at /server/api answers
      unauthenticated and advertises 79 endpoint families including core items, collections,
      communities, bitstreams and metadata schemas, a discovery search plane, a versioning plane, a
      statistics and usage-report plane, PID resolution, and LDN / COAR Notify inboxes. DSpace is
      open-source software Queen Mary self-hosts; no generic DSpace specification is saved under
      this slug, because the contract belongs to the DSpace project rather than to the university.
      A web application firewall in front of the host intermittently answers scripted clients with
      a JavaScript challenge or an outright block, which is what made this surface invisible to the
      2026-06-03 profile.
    humanURL: https://qmro.qmul.ac.uk/
    baseURL: https://qmro.qmul.ac.uk/server/api
    tags:
      - Research Repository
      - Open Access
      - DSpace
      - Scholarly Communication
      - Metadata
    properties:
      - type: x-service-document
        url: examples/queen-mary-university-of-london-qmro-dspace-api-root.json
      - type: Authentication
        url: authentication/queen-mary-university-of-london-authentication.yml
      - type: ResearchRepository
        url: https://qmro.qmul.ac.uk/
    x-operator: institution
    x-operator-evidence: >-
      Host qmro.qmul.ac.uk is under Queen Mary's own registrable domain, and the service document
      self-declares dspaceUI and dspaceServer as https://qmro.qmul.ac.uk. The software is DSpace;
      the deployment, the host and the content are the institution's.
    x-software: DSpace 8.4
    x-probe:
      baseURL_status: 200
      probed: '2026-09-01'
      note: >-
        200, 8621 bytes, application/hal+json on 2026-09-01. Repeat requests within the same minute
        are met with a WAF JavaScript challenge or a connection reset; the surface is live and
        rate-protected, not intermittent. The default dspaceName "DSpace at My University" is left
        unconfigured on the instance.

  - aid: queen-mary-university-of-london:qmplus-lti-platform
    name: QMplus LTI 1.3 Advantage Tool Platform
    description: >-
      QMplus, Queen Mary's Moodle virtual learning environment, runs as an LTI 1.3 / LTI Advantage
      tool platform and publishes the four endpoints the standard requires an external learning tool
      to find: a JSON Web Key Set of the platform's RSA signing keys, an OIDC authorization
      endpoint, an access-token endpoint that exchanges a signed client JWT, and the Advantage
      services endpoint that carries Names and Roles Provisioning and Assignment and Grade Services.
      This is the university's own keypair on the university's own host, and it is a live hit
      against the education regime's `lti` domain standard. It is a machine-to-machine integration
      plane for approved learning tools, not an open developer API.
    humanURL: https://qmplus.qmul.ac.uk/
    baseURL: https://qmplus.qmul.ac.uk/mod/lti/certs.php
