  detail: >-
    Six institution-operated surfaces (four institution, two federation) and two tenant
    relationships were found and verified by live
    probe on 2026-09-01, against a repo that previously carried an empty apis[] block and a
    description asserting that only OAI-PMH and a GitHub organization existed. The single most
    important correction is that the 2026-06-03 review recorded QMRO's OAI-PMH endpoint as "HTTP
    200, verb=Identify" — that response is 2426 bytes of obfuscated JavaScript bot-challenge with
    no OAI-PMH envelope in it, a textbook soft-200, and the DSpace 8 OAI path returns an explicit
    WAF interstitial ("Web Page Blocked!", attack_ID 20000021). OAI-PMH is therefore recorded as
    unverified, not conformant. What is real and was missed: the DSpace 8.4 REST API with 79
    endpoint families, an LTI 1.3 Advantage tool platform on QMplus with a live JWKS, the Moodle
    web-services endpoint, the Shibboleth IdP in the UK Access Management Federation, the Entra ID
    tenant, the Apocrita HPC documentation site, and a Primo VE deployment whose public
    configuration API returns 161KB of JSON naming "Queen Mary University of London" and whose SRU
    endpoint returned 84,622 MARCXML records to a live query. Two candidate surfaces were rejected
    on evidence rather than recorded: qmul.figshare.com is NOT a Figshare tenancy — a control probe
    of an invented subdomain returns the identical HTTP 202 with a zero-byte body, so the response
    proves a wildcard, not a tenant — and the AWS API Gateway URL embedded in every qmul.ac.uk page
    is explicitly marked rel="nofollow" aria-hidden "honeypot link", a bot trap, not an API. The
    profile is thin in developer-programme terms because Queen Mary genuinely runs none: no
    api.qmul.ac.uk, no developer.qmul.ac.uk, no data.qmul.ac.uk and no opendata.qmul.ac.uk resolve;
    no llms.txt; no security.txt; the 15,475-URL sitemap contains no developer or API page; and
    MySIS, timetables and MyQMUL are all sign-in walls.
