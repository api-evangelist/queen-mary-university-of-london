  - aid: queen-mary-university-of-london:qmplus-moodle-webservices
    name: QMplus Moodle Web Services (REST)
    description: >-
      The standard Moodle web-services REST entry point on QMplus. It answers an unauthenticated
      request with a structured moodle_exception carrying ERRORCODE invalidtoken, which proves the
      endpoint is enabled and that access is by an institutionally issued token. The function
      catalogue available to any given token is set per service by Queen Mary and is not published;
      there is no self-service route to a token and no external documentation of the deployment.
    humanURL: https://qmplus.qmul.ac.uk/
    baseURL: https://qmplus.qmul.ac.uk/webservice/rest/server.php
