      - type: Conformance
        url: conformance/queen-mary-university-of-london-conformance.yml
    x-operator: institution
    x-operator-evidence: >-
      qmplus.qmul.ac.uk is Queen Mary's own hostname and the RSA keypair published there is the
      institution's platform key. DNS shows the Moodle instance is hosted with Catalyst IT Europe
