- date: '2026-06-03'
  rating: 2
  summary: 'Queen Mary University of London has no central, branded developer portal or signup-gated public
    REST API program. The confirmed public, machine-accessible surface is standards-based and research-oriented:
    the QMRO DSpace institutional repository exposes a public OAI-PMH interface (verb=Identify returned
    HTTP 200, though the host intermittently rate- limits non-browser clients), and the QMUL GitHub organization
    (HTTP 200, ~18 repos) publishes staff open-source code. Core platforms — the main website, MyQMUL,
    and the FOI datasets page — return HTTP 403 to scripted requests and are browser/auth oriented; QMplus
    (Moodle) loads publicly but is a gated LMS, not a documented API. No endpoints were fabricated; only
    URLs probed live or independently corroborated (OpenDOAR/ROAR) are listed.'
  endpoints:
  - url: https://qmro.qmul.ac.uk/oai/request?verb=Identify
    status: 200
    note: QMRO DSpace OAI-PMH 2.0 endpoint; intermittently blocks non-browser user agents.
  - url: https://qmro.qmul.ac.uk/
