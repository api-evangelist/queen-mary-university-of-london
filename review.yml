- date: '2026-09-01'
  rating: 3
  summary: 'Re-profiled under the university pipeline, which put operator attribution ahead of artifact
    volume. The 2026-06-03 review was wrong in one specific and instructive way: it credited QMRO''s OAI-PMH
    endpoint on the strength of an HTTP 200 from verb=Identify. That body is 2426 bytes of obfuscated
    JavaScript bot-challenge with no OAI-PMH envelope in it, and the DSpace 8 OAI path returns an explicit
    WAF interstitial. The OAI claim is withdrawn. What the earlier pass missed is larger than what it
    got wrong: QMRO runs DSpace 8.4 and serves an unauthenticated HAL service document advertising 79
    endpoint families; QMplus is an LTI 1.3 Advantage tool platform publishing a live JWKS plus OIDC auth,
    token and services endpoints; the Moodle web-services REST endpoint is live and token-gated; Apocrita
    HPC documentation is self-hosted in Queen Mary''s own address space; the university''s Shibboleth
    IdP is retrievable as signed SAML metadata from the UK Access Management Federation; and its Microsoft
    Entra ID tenant publishes an OpenID Connect discovery document resolvable from the qmul.ac.uk domain
    hint. Two tenant relationships were recorded rather than claimed as Queen Mary''s engineering: Ex
    Libris Primo VE over Alma behind librarysearch.qmul.ac.uk (public configuration API and SRU both answer,
    84,622 records), and a SearchStax Solr index behind site and course search. Three registry memberships
    were evidenced: DataCite provider iuar with repository client bl.qmul, Crossref member 11031 with
    prefix 10.26494, and ROR 026zzn846. Two candidates were rejected on evidence: qmul.figshare.com is
    not a Figshare tenancy (an invented subdomain returns the identical 202 zero-byte body), and the AWS
    API Gateway URL on every qmul.ac.uk page is explicitly marked a honeypot link. No contract was saved
    and no spec was generated: Queen Mary publishes no OpenAPI and none was invented for it.'
